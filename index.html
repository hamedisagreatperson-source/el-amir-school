<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a0a2e">
  <meta name="description" content="منصة إدارة المدرسة - نظام شامل لإدارة التلاميذ، الأساتذة، الدورات، الدفع والحضور">
  <title>منصة إدارة المدرسة</title>

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="stylesheet" href="assets/css/teacher.css">
  <link rel="stylesheet" href="assets/css/student.css">
  <link rel="stylesheet" href="assets/css/mobile.css">

  <style>
    #app-loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-dark); display: flex; align-items: center;
      justify-content: center; z-index: 99999; flex-direction: column; gap: 20px;
    }
    #app-loader .loader-ring {
      width: 48px; height: 48px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    #app-loader .loader-text {
      color: var(--text-muted); font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div id="app-loader">
    <div class="loader-ring"></div>
    <div class="loader-text">جاري التحميل...</div>
  </div>

  <div id="app"></div>

  <script>
    window.APP_CONFIG = {
      // غيّر هذا الرابط برابط Railway الخاص بك بعد النشر
      API_URL: 'http://localhost:3000/api'
    };
  </script>

  <!-- Core JS -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/export.js"></script>

  <!-- Views: Login -->
  <script src="assets/js/views/login.js"></script>

  <!-- Views: Admin -->
  <script src="assets/js/views/admin/dashboard.js"></script>
  <script src="assets/js/views/admin/students.js"></script>
  <script src="assets/js/views/admin/teachers.js"></script>
  <script src="assets/js/views/admin/courses.js"></script>
  <script src="assets/js/views/admin/payments.js"></script>
  <script src="assets/js/views/admin/attendance.js"></script>
  <script src="assets/js/views/admin/requests.js"></script>
  <script src="assets/js/views/admin/schedule.js"></script>
  <script src="assets/js/views/admin/emails.js"></script>
  <script src="assets/js/views/admin/audit-log.js"></script>
  <script src="assets/js/views/admin/accounts.js"></script>

  <!-- Views: Teacher -->
  <script src="assets/js/views/teacher/dashboard.js"></script>
  <script src="assets/js/views/teacher/my-students.js"></script>
  <script src="assets/js/views/teacher/attendance.js"></script>
  <script src="assets/js/views/teacher/schedule.js"></script>
  <script src="assets/js/views/teacher/notes.js"></script>
  <script src="assets/js/views/teacher/requests.js"></script>

  <!-- Views: Student -->
  <script src="assets/js/views/student/dashboard.js"></script>
  <script src="assets/js/views/student/schedule.js"></script>
  <script src="assets/js/views/student/attendance.js"></script>
  <script src="assets/js/views/student/payments.js"></script>
  <script src="assets/js/views/student/notes.js"></script>

  <!-- App (must be last) -->
  <script src="assets/js/app.js"></script>

  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('app-loader');
      if (loader) loader.style.display = 'none';
    });
  </script>
</body>
</html>
